name: Build opensync image

# Builds the static SPA and pushes ghcr.io/valkyriweb/opensync.
# The VITE_* build args are baked into the bundle at build time and are NOT
# secret (Convex URL + WorkOS client id are public identifiers). The image is
# pulled by lue-kube (k3s/apps/opensync). After a build, pin the digest from
# the run summary into that repo's overlays/prod/kustomization.yaml.

on:
  push:
    branches: [lue/self-host]
    paths:
      - src/**
      - public/**
      - index.html
      - Dockerfile
      - nginx.conf
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: valkyriweb/opensync
  # Non-secret, inlined into the static bundle by Vite at build time.
  VITE_CONVEX_URL: https://good-aardvark-553.convex.cloud
  VITE_WORKOS_CLIENT_ID: client_01KVAZPMSWJ282FFAQ9GDWX38P
  VITE_REDIRECT_URI: https://opensync.bermont.digital/callback

jobs:
  build:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.vars.outputs.date_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +'%Y.%m.%d')"
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "date_tag=${build_date}.${short_sha}"
            echo "tags<<EOF"
            echo "${image}:${build_date}.${short_sha}"
            echo "${image}:sha-${short_sha}"
            echo "${image}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VITE_CONVEX_URL=${{ env.VITE_CONVEX_URL }}
            VITE_WORKOS_CLIENT_ID=${{ env.VITE_WORKOS_CLIENT_ID }}
            VITE_REDIRECT_URI=${{ env.VITE_REDIRECT_URI }}

      - name: Publish pin instructions
        shell: bash
        run: |
          {
            echo "### opensync image built"
            echo "GHCR: \`${REGISTRY}/${IMAGE_NAME}\`"
            echo "Tag: \`${{ steps.vars.outputs.date_tag }}\`"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin in lue-kube \`k3s/apps/opensync/overlays/prod/kustomization.yaml\`:"
            echo '```yaml'
            echo "    newTag: \"${{ steps.vars.outputs.date_tag }}\""
            echo "    digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
