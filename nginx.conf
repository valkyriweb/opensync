server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # k8s probe endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # hashed static assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy WorkOS AuthKit API calls through this first-party origin.
    # The SPA sets apiHostname=window.location.hostname, so /user_management/*
    # must reach WorkOS from this domain. Mirrors the Vite dev-server proxy in
    # vite.config.ts. nginx resolves api.workos.com at startup via cluster DNS.
    location /user_management {
        proxy_pass https://api.workos.com;
        proxy_set_header Host api.workos.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    # SPA fallback (client-side routing: /login, /callback, /dashboard, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
